<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cash-Flow Tracker</title>
    <link rel="stylesheet" href="style.css" />
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

    <div class="container">
        <h1>💰 Cash-Flow Tracker</h1>

        <!-- SALARY INPUT -->
        <div class="card">
            <h2>Set Your Salary</h2>
            <input type="number" id="salaryInput" placeholder="Enter total salary" />
            <button id="setSalaryBtn">Set Salary</button>
            <p id="salaryError" class="error hidden">Please enter a valid salary.</p>
        </div>

        <!-- EXPENSE INPUT -->
        <div class="card">
            <h2>Add Expense</h2>
            <input type="text" id="expenseName" placeholder="Expense name" />
            <input type="number" id="expenseAmount" placeholder="Expense amount" />
            <button id="addExpenseBtn">Add Expense</button>
            <p id="expenseError" class="error hidden">Please fill all fields correctly.</p>
        </div>

        <!-- SUMMARY -->
        <div class="card summary">
            <h2>Summary</h2>
            <p>Total Salary: <span id="displaySalary">₹0</span></p>
            <p>Total Expenses: <span id="displayExpenses">₹0</span></p>
            <p>Remaining Balance: <span id="displayBalance">₹0</span></p>
            <!-- Threshold alert -->
            <div id="alertBanner" class="alert-banner hidden">
                ⚠️ Warning: Balance is below 10% of your salary!
            </div>
        </div>

        <!-- EXPENSE LIST -->
        <div class="card">
            <h2>Expense List</h2>
            <ul id="expenseList"></ul>
        </div>

        <!-- PIE CHART -->
        <div class="card">
            <h2>Expense Chart</h2>
            <canvas id="expenseChart" width="300" height="300"></canvas>
        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
